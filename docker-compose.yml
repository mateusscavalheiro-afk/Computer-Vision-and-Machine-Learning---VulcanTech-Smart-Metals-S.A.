version: '3.8'

services:
  vulcantech-api:
    build: .
    container_name: vulcantech_edge_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./Ficheiros_IA:/app/Ficheiros_IA
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
